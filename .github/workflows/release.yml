name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/fuel-map-card.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
